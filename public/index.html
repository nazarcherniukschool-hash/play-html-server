
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 PLAY HTML</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>🎮 PLAY HTML</h1>
    <span>Магазин HTML-ігор</span>
  </header>

  <section class="hero">
    <h2>Твій світ HTML-ігор!</h2>
    <p>Знаходь цікаві ігри та відкривай нові пригоди.</p>
    <input
      class="search"
      id="search"
      type="search"
      placeholder="🔍 Пошук ігор..."
    >
  </section>

  <main>
    <h2>🔥 Каталог ігор</h2>
    <div class="games" id="games">
      <p>Завантаження ігор...</p>
    </div>
  </main>

  <footer>© 2026 PLAY HTML</footer>
</body>
</html>
